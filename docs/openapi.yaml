openapi: 3.0.3
info:
  title: India Dashboard API
  version: 0.1.0
  description: Read-only JSON API for India's global indicator rankings.
servers:
  - url: /
paths:
  /api/scatter:
    get:
      summary: Correlation data for two indicators
      parameters:
        - in: query
          name: x
          required: true
          schema: { type: string }
        - in: query
          name: y
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scatter points + Pearson r
  /api/rankings:
    get:
      summary: World ranking for an indicator
      parameters:
        - in: query
          name: indicator
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ranking list + India row + history
  /api/indicators/series:
    get:
      summary: Time series for a country/indicator
      parameters:
        - in: query
          name: country
          required: true
          schema: { type: string }
        - in: query
          name: indicator
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Series data
  /api/indicators/leaderboard:
    get:
      summary: Leaderboard for an indicator/year
      parameters:
        - in: query
          name: indicator
          required: true
          schema: { type: string }
        - in: query
          name: year
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Leaderboard rows
  /api/ai/insights:
    post:
      summary: Groq-generated 3-sentence analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                iso3: { type: string }
                year: { type: integer }
      responses:
        "200":
          description: Analysis text
  /api/ai/chat:
    post:
      summary: RAG chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: string }
                conversationHistory: { type: array, items: { type: object } }
      responses:
        "200":
          description: Answer + citations
